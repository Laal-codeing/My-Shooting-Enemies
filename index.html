<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enemies Killer</title>
<style>
body { text-align: center; font-family: Arial; background: black; color: white; margin: 0; }
h1 { color: yellow; font-size: 24px; }
#score { font-size: 22px; color: white; text-align: right; width: 400px; margin: auto; max-width: 95%;  }
canvas { background: black; border: 4px solid yellow; max-width: 95%; }
button { font-size: 20px; padding: 10px 20px; background: red; color: white; border: none; }
p { color: white; }
</style>
</head>
<body>
<h1>🔫 Enemies Killer 🔫</h1>
<div id="score">Score: 0</div>
<canvas id="game" width="400" height="500"></canvas>
<p>Mouse ghumao, Click karo, Goli chalao!</p>
<button onclick="startGame()">DOBARA KHELO</button>

<script>
var c = document.getElementById("game");
var x = c.getContext("2d");
var playerX = 180;
var bullets = [];
var enemies = [];
var score = 0;
var over = false;
var lives = 3;
var level = 1;
c.addEventListener("mousemove", function(e) {
  var r = c.getBoundingClientRect();
  playerX = e.clientX - r.left - 20;
});
c.addEventListener("touchmove", function(e) {
  var r = c.getBoundingClientRect();
  playerX = e.touches[0].clientX - r.left - 20;
});
c.addEventListener("click", shoot);
c.addEventListener("touchstart", shoot);

function shoot() {
  if (over) return;
  bullets.push({bx: playerX + 38, by: 455});
}

function startGame() {
  bullets = [];
  enemies = [];
  boss = null;
  bossAaya = false;
  bossLevel = 0;
  score = 0;
  over = false;
  lives = 3;
  level = 1;
  document.getElementById("score").innerHTML = "Score: 0 | Lives: 3 | Level: 1";
}

setInterval(function() {
  if (over) return;
  enemies.push({ex: Math.random() * 360, ey: 0});
}, 900);
setInterval(function() { shoot(); }, 250);
setInterval(function() {
  if (over) return;
  x.clearRect(0, 0, 400, 500);
  x.fillStyle = "green";
  x.fillRect(0, 480, 400, 20);
  x.fillstyle = "yellow";
  x.fillRect(playerX, 460, 80, 15);
 if (level >= 2 && !boss && bossLevel !== level) { bossLevel = level; boss = {ex: 160, ey: 0, hp: 5}; }
if (boss) { boss.ey = boss.ey + 1; x.font = "80px Arial"; x.fillText("👹", boss.ex, boss.ey); }
  if (boss && boss.ey > 480) { boss = null; }

  for (var i = 0; i < bullets.length; i++) {
    bullets[i].by = bullets[i].by - 12;
    x.fillStyle = "red";
    x.fillRect(bullets[i].bx, bullets[i].by, 5, 15);
  }

  for (var j = 0; j < enemies.length; j++) {
    enemies[j].ey = enemies[j].ey + 2 + level / 6;
    x.font = "35px Arial";
    x.fillText("👹", enemies[j].ex, enemies[j].ey);

    for (var k = 0; k < bullets.length; k++) {
      if (bullets[k].bx > enemies[j].ex - 10 && bullets[k].bx < enemies[j].ex + 40 && bullets[k].by > enemies[j].ey - 30 && bullets[k].by < enemies[j].ey + 10) {
        enemies.splice(j, 1);
        bullets.splice(k, 1);
        score = score + 10;
       level = 1 + Math.floor(score / 50);
document.getElementById("score").innerHTML = "Score: " + score + " | Lives: " + lives + " | Level: " + level;
        break;
      }
    }
   for (var k = 0; k < bullets.length; k++) { if (boss && bullets[k].bx > boss.ex - 100 && bullets[k].bx < boss.ex + 200 && bullets[k].by > boss.ey - 200 && bullets[k].by < boss.ey + 100) { bullets.splice(k, 1); boss.hp = boss.hp - 1; if (boss.hp <= 0) { boss = null; score = score + 50; } break; } }

  if (enemies[j] && enemies[j].ey > 470) {
enemies.splice(j, 1);
lives = lives - 1;
document.getElementById("score").innerHTML = "Score: " + score + " | Lives: " + lives + " | Level: " + level;
if (lives <= 0) {
over = true;
x.fillStyle = "red";
x.font = "30px Arial";
x.fillText("GAME OVER!", 110, 250);
x.font = "20px Arial";
x.fillText("DOBARA KHELO dabao", 75, 290);
}
}
  }
}, 30);
</script>
</body>
</html>
